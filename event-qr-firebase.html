<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码签到 - 智慧新空间</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0d2137 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
        }

        .qr-wrapper {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
            margin-bottom: 30px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            display: block;
        }

        .hint {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 1.8;
        }

        .hint strong {
            color: #64c8ff;
        }

        .print-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #64c8ff, #1890ff);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.4);
        }

        @media print {
            body {
                background: #fff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .title, .subtitle, .hint, .print-btn {
                color: #000;
            }

            .qr-wrapper {
                box-shadow: none;
                border: 2px solid #ccc;
            }
        }

        .tech-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .tech-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.2), transparent);
            height: 1px;
            width: 100%;
        }

        .tech-line:nth-child(1) { top: 20%; }
        .tech-line:nth-child(2) { top: 40%; }
        .tech-line:nth-child(3) { top: 60%; }
        .tech-line:nth-child(4) { top: 80%; }
    </style>
</head>
<body>
    <div class="tech-decoration">
        <div class="tech-line"></div>
        <div class="tech-line"></div>
        <div class="tech-line"></div>
        <div class="tech-line"></div>
    </div>

    <div class="container">
        <h1 class="title">智慧新空间</h1>
        <p class="subtitle">扫码签到，获取专属欢迎语</p>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>

        <p class="hint">
            请使用微信或浏览器扫描二维码<br>
            签到成功后大屏幕将显示您的<strong>专属欢迎标语</strong>
        </p>

        <button class="print-btn" onclick="window.print()">打印二维码</button>
    </div>

    <script>
        // 生成二维码 - 指向 Firebase 版本的签到页面
        const checkinUrl = window.location.href.replace('event-qr-firebase.html', 'event-checkin-firebase.html');

        new QRCode(document.getElementById("qrcode"), {
            text: checkinUrl,
            width: 200,
            height: 200,
            colorDark: "#1a3a5c",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
