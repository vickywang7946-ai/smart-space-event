<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧新空间 - 入场欢迎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0d2137 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 科技线条背景 */
        .tech-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .tech-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.3), transparent);
            height: 1px;
            animation: moveLine 8s linear infinite;
        }

        .tech-line:nth-child(1) { top: 20%; width: 100%; animation-delay: 0s; }
        .tech-line:nth-child(2) { top: 40%; width: 80%; left: 10%; animation-delay: 2s; }
        .tech-line:nth-child(3) { top: 60%; width: 60%; left: 20%; animation-delay: 4s; }
        .tech-line:nth-child(4) { top: 80%; width: 90%; left: 5%; animation-delay: 6s; }

        .tech-line-v {
            position: absolute;
            background: linear-gradient(180deg, transparent, rgba(100, 200, 255, 0.2), transparent);
            width: 1px;
            animation: moveLineV 10s linear infinite;
        }

        .tech-line-v:nth-child(5) { left: 15%; height: 100%; animation-delay: 1s; }
        .tech-line-v:nth-child(6) { left: 35%; height: 80%; top: 10%; animation-delay: 3s; }
        .tech-line-v:nth-child(7) { left: 65%; height: 90%; top: 5%; animation-delay: 5s; }
        .tech-line-v:nth-child(8) { left: 85%; height: 70%; top: 15%; animation-delay: 7s; }

        @keyframes moveLine {
            0% { transform: translateX(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        @keyframes moveLineV {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* 网格背景 */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(100, 200, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 200, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* 星光效果 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #c0c0c0 0%, #e8e8e8 50%, transparent 70%);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.8), 0 0 20px rgba(192, 192, 192, 0.4);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 80px;
            max-width: 1200px;
        }

        /* 标题 */
        .title {
            font-size: 48px;
            color: #fff;
            margin-bottom: 50px;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
            letter-spacing: 8px;
        }

        /* 标语卡片 */
        .slogan-card {
            background: linear-gradient(135deg, rgba(26, 58, 92, 0.8) 0%, rgba(13, 33, 55, 0.9) 100%);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 20px;
            padding: 60px 80px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 60px rgba(100, 200, 255, 0.2),
                inset 0 0 60px rgba(100, 200, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .slogan-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #64c8ff, transparent, #64c8ff, transparent);
            border-radius: 20px;
            z-index: -1;
            opacity: 0.5;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .slogan-text {
            font-size: 42px;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 角落装饰 */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(100, 200, 255, 0.5);
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* 提示文字 */
        .hint {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* 签到提示 */
        .checkin-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(82, 196, 26, 0.9), rgba(56, 158, 13, 0.9));
            color: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            box-shadow: 0 0 30px rgba(82, 196, 26, 0.5);
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.5s ease;
            z-index: 100;
        }

        .checkin-notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* 签到记录面板 */
        .checkin-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(26, 58, 92, 0.95), rgba(13, 33, 55, 0.95));
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            min-width: 280px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
            z-index: 50;
        }

        .checkin-panel h3 {
            color: #64c8ff;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }

        .checkin-count {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkin-count span {
            color: #52c41a;
            font-size: 32px;
        }

        .checkin-list {
            list-style: none;
        }

        .checkin-item {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(100, 200, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkin-item:last-child {
            border-bottom: none;
        }

        .checkin-item .time {
            color: rgba(100, 200, 255, 0.8);
            font-size: 12px;
        }

        .checkin-item .badge {
            background: linear-gradient(135deg, #52c41a, #389e0d);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- 科技线条背景 -->
    <div class="tech-lines">
        <div class="tech-line"></div>
        <div class="tech-line"></div>
        <div class="tech-line"></div>
        <div class="tech-line"></div>
        <div class="tech-line-v"></div>
        <div class="tech-line-v"></div>
        <div class="tech-line-v"></div>
        <div class="tech-line-v"></div>
    </div>

    <!-- 网格背景 -->
    <div class="grid-overlay"></div>

    <!-- 星光效果 -->
    <div class="stars" id="stars"></div>

    <!-- 签到提示 -->
    <div class="checkin-notification" id="notification">
        ✓ 有新用户签到
    </div>

    <!-- 签到记录面板 -->
    <div class="checkin-panel" id="checkinPanel">
        <h3>签到记录</h3>
        <div class="checkin-count">已签到: <span id="checkinCount">0</span> 人</div>
        <ul class="checkin-list" id="checkinList">
            <li class="checkin-item" style="color: rgba(255,255,255,0.4);">暂无签到记录</li>
        </ul>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <h1 class="title">智慧新空间</h1>

        <div class="slogan-card">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <p class="slogan-text" id="slogan">欢迎来到智慧新空间，你的 AI 能量值已充满！</p>
        </div>

        <p class="hint">扫码入场，大屏幕随机显示专属标语</p>
    </div>

    <script>
        // 标语列表
        const slogans = [
            "欢迎来到智慧新空间，你的 AI 能量值已充满！",
            "在新的办公环境中，愿你的创意如 AI 算法般无限迭代！",
            "默默续航、稳定输出、全力兜底、微光聚力",
            "AI创新、技术破局、算力加持、智控风险",
            "领航前行、核心贡献、聚力启新、跃迁未来"
        ];

        let lastCheckinTime = 0;
        let checkinCount = 0;
        let checkinRecords = [];

        // 生成随机星光
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 50;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';

                const size = 2 + Math.random() * 4;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                starsContainer.appendChild(star);
            }
        }

        // 显示随机标语（确保与当前不同）
        function showRandomSlogan(userName) {
            const sloganElement = document.getElementById('slogan');
            const currentSlogan = sloganElement.textContent;

            // 过滤掉当前标语，确保选择不同的
            const availableSlogans = slogans.filter(s => s !== currentSlogan);
            const randomIndex = Math.floor(Math.random() * availableSlogans.length);
            const newSlogan = availableSlogans[randomIndex];

            // 淡出
            sloganElement.style.animation = 'none';
            setTimeout(() => {
                if (userName) {
                    sloganElement.innerHTML = `<span style="color:#64c8ff">${userName}</span>，${newSlogan}`;
                } else {
                    sloganElement.textContent = newSlogan;
                }
                sloganElement.style.animation = 'fadeInUp 0.8s ease-out';
            }, 100);

            // 显示签到提示
            showNotification(userName);

            // 添加签到记录
            addCheckinRecord(userName);
        }

        // 添加签到记录
        function addCheckinRecord(userName) {
            checkinCount++;
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            const record = {
                name: userName || `访客${checkinCount}`,
                time: timeStr,
                id: Date.now()
            };

            checkinRecords.unshift(record);
            if (checkinRecords.length > 10) {
                checkinRecords.pop();
            }

            updateCheckinPanel();
        }

        // 更新签到面板
        function updateCheckinPanel() {
            document.getElementById('checkinCount').textContent = checkinCount;

            const listElement = document.getElementById('checkinList');
            if (checkinRecords.length === 0) {
                listElement.innerHTML = '<li class="checkin-item" style="color: rgba(255,255,255,0.4);">暂无签到记录</li>';
                return;
            }

            listElement.innerHTML = checkinRecords.map((record, index) => `
                <li class="checkin-item">
                    <span>${record.name} <span class="badge">已签到</span></span>
                    <span class="time">${record.time}</span>
                </li>
            `).join('');
        }

        // 显示签到提示
        function showNotification(userName) {
            const notification = document.getElementById('notification');
            if (userName) {
                notification.textContent = `✓ ${userName} 已签到`;
            } else {
                notification.textContent = '✓ 有新用户签到';
            }
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 监听签到事件 - 多重保障
        function listenForCheckin() {
            // 方案1: 监听 storage 事件
            window.addEventListener('storage', function(e) {
                if (e.key === 'newCheckin') {
                    const checkinTime = parseInt(e.newValue || '0');
                    if (checkinTime > lastCheckinTime) {
                        lastCheckinTime = checkinTime;
                        showRandomSlogan();
                    }
                }
            });

            // 方案2: BroadcastChannel（更可靠）
            if ('BroadcastChannel' in window) {
                const bc = new BroadcastChannel('smart-space-checkin');
                bc.onmessage = function(e) {
                    if (e.data === 'checkin') {
                        showRandomSlogan();
                    } else if (e.data && e.data.type === 'checkin') {
                        const userName = e.data.userName;
                        if (userName) {
                            localStorage.setItem('checkinUserName', userName);
                        }
                        showRandomSlogan(userName || null);
                    }
                };
            }

            // 方案3: 高频轮询检查（每200毫秒）
            setInterval(() => {
                const checkinTime = parseInt(localStorage.getItem('newCheckin') || '0');
                if (checkinTime > lastCheckinTime) {
                    lastCheckinTime = checkinTime;
                    const userName = localStorage.getItem('checkinUserName');
                    showRandomSlogan(userName || null);
                }
            }, 200);
        }

        // 初始化
        createStars();
        listenForCheckin();

        // 点击切换标语并记录签到
        document.querySelector('.slogan-card').addEventListener('click', function() {
            const userName = prompt('请输入签到人姓名（或留空）:', '');
            showRandomSlogan(userName || null);
        });
    </script>
</body>
</html>
