<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>签到成功</title>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        // Firebase 配置 - 与大屏幕页面相同
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemo123456789",
            authDomain: "smart-space-event-demo.firebaseapp.com",
            databaseURL: "https://smart-space-event-demo-default-rtdb.firebaseio.com",
            projectId: "smart-space-event-demo",
            storageBucket: "smart-space-event-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 触发大屏幕更新
        async function triggerDisplay() {
            const checkinId = Date.now().toString();
            try {
                await set(ref(database, 'checkins/latest'), {
                    id: checkinId,
                    time: new Date().toISOString()
                });
                console.log('签到成功，已通知大屏幕');
            } catch (error) {
                console.error('签到失败:', error);
            }
        }

        // 创建烟花效果
        function createFireworks() {
            const container = document.getElementById('fireworks');
            const colors = ['#64c8ff', '#52c41a', '#ffd700', '#ff6b6b', '#c0c0c0'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 60 + '%';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.animationDelay = Math.random() * 0.5 + 's';
                    container.appendChild(firework);

                    setTimeout(() => firework.remove(), 1500);
                }, i * 100);
            }
        }

        // 页面加载完成后触发签到
        window.addEventListener('DOMContentLoaded', () => {
            triggerDisplay();
            createFireworks();
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0d2137 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: explode 1.5s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(20);
                opacity: 0.8;
            }
            100% {
                transform: scale(30);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #52c41a, #389e0d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 0 0 40px rgba(82, 196, 26, 0.5);
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon::after {
            content: '✓';
            font-size: 60px;
            color: #fff;
        }

        .title {
            font-size: 36px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .subtitle {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .card {
            background: linear-gradient(135deg, rgba(26, 58, 92, 0.8), rgba(13, 33, 55, 0.9));
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            margin-top: 40px;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.2);
        }

        .hint {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #64c8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="fireworks" id="fireworks"></div>

    <div class="container">
        <div class="success-icon"></div>
        <h1 class="title">已签到</h1>

        <div class="card">
            <p class="subtitle">欢迎进入<br>智慧空间</p>
        </div>

        <p class="hint">请留意大屏幕显示的专属欢迎语</p>
    </div>
</body>
</html>
