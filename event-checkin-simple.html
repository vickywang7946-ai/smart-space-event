<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎进入 - 智慧新空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0d2137 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #64c8ff, transparent);
            top: -100px;
            right: -100px;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #4a90d9, transparent);
            bottom: -50px;
            left: -50px;
        }

        /* 星光 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, #c0c0c0 0%, transparent 70%);
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        /* 成功图标 */
        .success-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #52c41a, #389e0d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(82, 196, 26, 0.5);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(82, 196, 26, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 70px rgba(82, 196, 26, 0.7); }
        }

        .success-icon::after {
            content: '✓';
            font-size: 60px;
            color: #fff;
        }

        /* 欢迎文字 */
        .welcome-title {
            font-size: 42px;
            color: #52c41a;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(82, 196, 26, 0.5);
            letter-spacing: 6px;
            animation: fadeInUp 0.6s ease-out;
        }

        .welcome-text {
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
            letter-spacing: 4px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 提示文字 */
        .hint {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            letter-spacing: 2px;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .hint span {
            color: #64c8ff;
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #c0c0c0, transparent);
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <!-- 星光 -->
    <div class="stars" id="stars"></div>

    <!-- 粒子效果 -->
    <div class="particles" id="particles"></div>

    <!-- 主内容 -->
    <div class="container">
        <div class="success-icon"></div>

        <p class="welcome-title">欢迎进入</p>
        <p class="welcome-text">智慧新空间</p>

        <p class="hint">请留意大屏幕<br><span>您的专属欢迎标语正在显示</span></p>
    </div>

    <script>
        // 生成随机星光
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 40;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (1.5 + Math.random() * 2) + 's';

                const size = 2 + Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                starsContainer.appendChild(star);
            }
        }

        // 生成粒子
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (8 + Math.random() * 6) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // 初始化
        createStars();
        createParticles();
    </script>
</body>
</html>
